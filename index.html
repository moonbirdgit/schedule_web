<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的課表</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="主選單">
    <div class="brand"><span class="logo">▦</span><b>我的課表</b></div>
    <button data-view="week"><i>▦</i><span>週課表</span></button>
    <button data-view="today"><i>☰</i><span>今日</span></button>
    <button data-view="tasks"><i>☑</i><span>作業</span><em id="badge" hidden></em></button>
    <button data-view="settings"><i>⚙</i><span>設定</span></button>
    <button data-view="login"><i>⇩</i><span>匯入</span></button>
    <div class="foot" id="foot"></div>
  </nav>

  <main>
    <!-- 週課表 -->
    <section id="view-week" class="view">
      <header class="bar">
        <h1>週課表</h1>
        <div class="pager">
          <button id="prev" aria-label="上一週">‹</button>
          <span id="weekLabel"></span>
          <button id="next" aria-label="下一週">›</button>
          <button id="thisWeek" class="ghost">回到本週</button>
        </div>
        <button id="addBtn" class="primary">＋ 新增課程</button>
      </header>
      <div class="legend" id="legend"></div>
      <div class="grid" id="grid"></div>
      <p class="hint">點課程看詳細內容 · 點空白格子可直接新增課程</p>
    </section>

    <!-- 今日 -->
    <section id="view-today" class="view">
      <div id="today"></div>
    </section>

    <!-- 作業與考試 -->
    <section id="view-tasks" class="view">
      <header class="bar"><h1>作業與考試</h1></header>
      <form id="taskForm" class="inline">
        <input id="tTitle" placeholder="新增作業或考試" required>
        <select id="tCourse" aria-label="課程"></select>
        <select id="tDue" aria-label="截止日">
          <option value="1">週一</option><option value="2">週二</option><option value="3">週三</option>
          <option value="4">週四</option><option value="5" selected>週五</option>
        </select>
        <button class="primary">新增</button>
      </form>
      <ul class="tasks" id="taskList"></ul>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view">
      <header class="bar"><h1>設定</h1></header>
      <div class="panel">
        <label>學期名稱<input id="sTerm"></label>
        <label>第 1 週的星期一<input id="sStart" type="date"></label>
        <button id="toLogin" type="button" class="ghost">從北商校務系統匯入課表</button>
        <button id="reset" class="ghost danger">還原範例資料</button>
      </div>
    </section>

    <!-- 北商登入匯入（內容由 login.js 產生） -->
    <section id="view-login" class="view" aria-label="從北商匯入課表"></section>
  </main>
</div>

<!-- 課程詳細 -->
<dialog id="detail" class="sheet" aria-label="課程詳細"></dialog>

<!-- 新增／編輯課程 -->
<dialog id="form" class="modal" aria-label="課程表單">
  <form id="courseForm">
    <h2 id="fTitle">新增課程</h2>
    <input type="hidden" id="fOrig">
    <div id="fPrev" class="prev" aria-label="預覽"></div>
    <label>課程名稱<input id="fName" required></label>
    <div class="two">
      <label>課程代碼<input id="fCode" placeholder="例如 CS101"></label>
      <label>學分<input id="fCredits" type="number" min="0" max="9" step="1" value="0"></label>
    </div>
    <div class="two">
      <label>教室<input id="fRoom"></label>
      <label>老師<input id="fTeacher"></label>
    </div>
    <label>類別<select id="fType"></select></label>
    <div>
      <p class="lbl">上課時段（每週重複）</p>
      <div id="fSlots" class="slots"></div>
      <button type="button" class="ghost" data-addslot>＋ 新增一個時段</button>
    </div>
    <div>
      <p class="lbl">顏色</p>
      <div id="fColors" class="swatches"></div>
    </div>
    <label>備註<textarea id="fNote" rows="3" placeholder="例如：記得帶運動服、期中範圍…"></textarea></label>
    <p id="fErr" class="err" role="alert"></p>
    <div class="actions">
      <button type="button" class="ghost" data-close>取消</button>
      <button class="primary">儲存</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
<script src="login.js"></script>
</body>
</html>
