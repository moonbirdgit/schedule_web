        function DialogLocation(dialogWidth, dialogHeight) {//showModalDialog置中
            var iWidth = dialogWidth;
            var iHeight = dialogHeight;
            var iTop = (window.screen.availHeight - 20 - iHeight) / 2;
            var iLeft = (window.screen.availWidth - 10 - iWidth) / 2;
            return 'dialogWidth:' + iWidth + 'px;dialogHeight:' + iHeight + 'px;dialogTop: ' + iTop + 'px; dialogLeft: ' + iLeft + 'px;center:yes;scroll:no;status:no;resizable:0;location:no';

    <script>
        function Do_Login() {
            var http = new XMLHttpRequest();
            var url = "/HttpRequest/Login.ashx";
            var params = 'CheckCode=' + document.getElementById('CheckCode').value;
            params += '&Model=Check_Code_TF';

            http.open("POST", url, true);

            http.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            http.setRequestHeader("Content-length", params.length);
            http.setRequestHeader("Connection", "close");

            http.onreadystatechange = function () {
                if (http.readyState == 4) {
                    if (http.status == 200) {
                        Show_Login(http.responseText);
                    } else {
                        return alert('伺服器錯誤');
                    }
                }
            };

            http.send(params);
        }

        function Show_Login(JData) {
           
            var pwdField = document.getElementById('PWD');

            if (JData.indexOf("loginbtn") !== -1) {
              
                if (pwdField.value.length > 20) {
                    alert("密碼長度不可超過 20 個字元！");

                  
                    document.getElementById('CheckCode').value = '';
                    document.getElementById('Validation_Image').setAttribute('src', '/HttpRequest/MakeCheckCodePIC.ashx?' + Math.random());

                    return; 
                }
            }
            eval(JData);
            
            
        }
    </script>
